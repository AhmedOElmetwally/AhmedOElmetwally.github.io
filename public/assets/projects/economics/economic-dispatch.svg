<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="t d"><title id="t">Constrained economic dispatch result</title><desc id="d">Generation allocation for a 975 megawatt demand across three units.</desc><rect width="1200" height="720" fill="#f7f3ed"/><text x="70" y="80" font-family="Arial" font-size="18" font-weight="700" letter-spacing="3" fill="#ab987d">POWER-SYSTEM ECONOMICS</text><text x="70" y="142" font-family="Arial" font-size="44" font-weight="700" fill="#1d3245">Constrained dispatch for 975 MW</text><line x1="110" y1="580" x2="1100" y2="580" stroke="#1d3245" stroke-width="3"/><g font-family="Arial" text-anchor="middle"><g transform="translate(210)"><rect x="0" y="210" width="210" height="370" rx="16" fill="#1d3245"/><text x="105" y="260" fill="#dbc7b0" font-size="18" font-weight="700">UNIT 1</text><text x="105" y="400" fill="#fff" font-size="58" font-weight="700">450</text><text x="105" y="435" fill="#dce3e8" font-size="20">MW</text><text x="105" y="620" fill="#1d3245" font-size="18">At upper limit</text></g><g transform="translate(495)"><rect x="0" y="312" width="210" height="268" rx="16" fill="#37546d"/><text x="105" y="360" fill="#dbc7b0" font-size="18" font-weight="700">UNIT 2</text><text x="105" y="460" fill="#fff" font-size="58" font-weight="700">325</text><text x="105" y="495" fill="#dce3e8" font-size="20">MW</text></g><g transform="translate(780)"><rect x="0" y="415" width="210" height="165" rx="16" fill="#4a6b8b"/><text x="105" y="460" fill="#dbc7b0" font-size="18" font-weight="700">UNIT 3</text><text x="105" y="520" fill="#fff" font-size="50" font-weight="700">200</text><text x="105" y="552" fill="#dce3e8" font-size="18">MW</text></g></g><rect x="820" y="70" width="300" height="105" rx="18" fill="#fff" stroke="#dbc7b0" stroke-width="2"/><text x="850" y="112" font-family="Arial" font-size="16" fill="#4a6b8b">INCREMENTAL COST</text><text x="850" y="150" font-family="Arial" font-size="30" font-weight="700" fill="#1d3245">λ = 9.40 $/MWh</text></svg>
