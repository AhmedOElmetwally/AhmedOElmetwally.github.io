<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="t d"><title id="t">Electrical utilization study results</title><desc id="d">A visual summary of lighting, traction and industrial heating calculations.</desc><rect width="1200" height="720" fill="#1d3245"/><text x="70" y="82" font-family="Arial" font-size="18" font-weight="700" letter-spacing="3" fill="#dbc7b0">DISTRIBUTION • UTILIZATION • LIGHTING</text><text x="70" y="148" font-family="Arial" font-size="43" font-weight="700" fill="#fff">Engineering calculations in context</text><g font-family="Arial"><g transform="translate(70 220)"><rect width="320" height="380" rx="24" fill="#f7f9fb"/><circle cx="160" cy="110" r="45" fill="#dbc7b0"/><path d="M140 160h40m-34 20h28" stroke="#1d3245" stroke-width="6"/><text x="28" y="245" fill="#4a6b8b" font-size="16" font-weight="700">LIGHTING</text><text x="28" y="302" fill="#1d3245" font-size="48" font-weight="700">314 lm</text><text x="28" y="338" fill="#4a6b8b" font-size="17">from 25 cd mean spherical intensity</text></g><g transform="translate(440 220)"><rect width="320" height="380" rx="24" fill="#37546d"/><path d="M55 135h210M80 100h140l35 35H55z" fill="none" stroke="#dbc7b0" stroke-width="8"/><circle cx="110" cy="155" r="18" fill="#fff"/><circle cx="220" cy="155" r="18" fill="#fff"/><text x="28" y="245" fill="#dbc7b0" font-size="16" font-weight="700">ELECTRIC TRACTION</text><text x="28" y="302" fill="#fff" font-size="42" font-weight="700">48.22 km/h</text><text x="28" y="338" fill="#dce3e8" font-size="17">38.24 Wh/ton-km</text></g><g transform="translate(810 220)"><rect width="320" height="380" rx="24" fill="#234059" stroke="#4a6b8b" stroke-width="2"/><path d="M80 130c25-45 45 45 70 0s45 45 70 0" fill="none" stroke="#dbc7b0" stroke-width="8"/><text x="28" y="245" fill="#dbc7b0" font-size="16" font-weight="700">INDUSTRIAL HEATING</text><text x="28" y="302" fill="#fff" font-size="42" font-weight="700">1 ↔ 16 kW</text><text x="28" y="338" fill="#dce3e8" font-size="17">series vs parallel connection</text></g></g><text x="70" y="665" font-family="Arial" font-size="18" fill="#dce3e8">Verified calculation examples, redrawn for portfolio presentation</text></svg>
